# @package _global_
run:
  solver: program_synthesis
  num_episodes: 1
  solver_kwargs:
    demos: null
    mode: full
    synthesis_approach: id-first
    num_blocks: 3
    slots: 5
    iterations: 20
    refinements: 5
    cem_iterations: 2
    cem_samples: 8
    cem_elites: 2
    invariant_relations: [ON_star, Higher, Scattered, equality]
    supported_towers: true
    table_surface_height: 0.0
    initial_arm: null
    output_dir: runs
    smoke: false

env:
  env_id: StackNCube-v1
  control_mode: pd_ee_delta_pose
  num_envs: 1
  reward_mode: sparse
  num_cubes: 3
